# AI-ULU Coolify Deployment - Redis'siz Versiyon
# İlk deployment için Redis olmadan çalışır

version: '3.8'

services:
  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Supabase
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # App URL
      - NEXT_PUBLIC_APP_URL=${APP_URL}
    labels:
      - "coolify.managed=true"
      - "coolify.type=application"
      - "coolify.name=ai-ulu-frontend"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-ulu-network

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Redis YOK - memory cache kullanılacak
    labels:
      - "coolify.managed=true"
      - "coolify.type=application"
      - "coolify.name=ai-ulu-backend"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ai-ulu-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/coolify.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    labels:
      - "coolify.managed=true"
      - "coolify.type=proxy"
      - "coolify.name=ai-ulu-nginx"
      - "traefik.enable=true"
      - "traefik.http.routers.ai-ulu.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.ai-ulu.entrypoints=websecure"
      - "traefik.http.routers.ai-ulu.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-ulu.loadbalancer.server.port=80"
    networks:
      - ai-ulu-network

volumes:
  nginx_cache:
    driver: local

networks:
  ai-ulu-network:
    driver: bridge
