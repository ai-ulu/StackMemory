# Smithery configuration for StackMemory MCP Server
# https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      defaultProjectId:
        type: string
        default: "default"
        description: "Default project ID for memory operations"
      maxResults:
        type: number
        default: 50
        description: "Maximum number of results returned by queries"
      enableConceptClustering:
        type: boolean
        default: true
        description: "Enable AI-powered concept clustering for memories"
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/_worker.js'],
      env: {
        DEFAULT_PROJECT_ID: config.defaultProjectId || 'default',
        MAX_RESULTS: String(config.maxResults || 50),
        ENABLE_CLUSTERING: config.enableConceptClustering ? 'true' : 'false'
      }
    })
remotes:
  - type: streamable-http
    url: "https://stackmemory-mcp.pages.dev/mcp"
