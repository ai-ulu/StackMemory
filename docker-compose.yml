# StackMemory — Unified Deployment
#
# Architecture (v3.2): single source of truth = Cloudflare D1 + Vectorize via
# the MCP server. The Next.js frontend talks to MCP through HTTP. There is no
# separate FastAPI backend or Python bridge anymore.
#
# Quick start:
#   cp .env.example .env  # fill MCP_SERVER_URL + Supabase auth keys
#   docker compose up -d  # frontend + (optional) self-hosted mcp-server
#
# Bots (Slack/Discord/Telegram) and the Chrome extension are independent and
# can be enabled via Compose profiles.

services:
  # ---------------------------------------------------------------------------
  # Frontend — Next.js dashboard + API routes (proxy to MCP server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - DOMAIN=${DOMAIN}
      - STACKMEMORY_LOCAL_MODE=${STACKMEMORY_LOCAL_MODE}
      - NEXT_PUBLIC_STACKMEMORY_LOCAL_MODE=${NEXT_PUBLIC_STACKMEMORY_LOCAL_MODE}
      # Auth / billing / teams (Supabase identity domain — NOT memories)
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Memory / brain → MCP server (single source of truth)
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - NEXT_PUBLIC_MCP_SERVER_URL=${NEXT_PUBLIC_MCP_SERVER_URL}
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN}
      # Optional integrations
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MCP Server — Cloudflare-targeted (this image is for self-host/local only)
  #
  # In production the canonical endpoint is https://stackmemory-mcp.pages.dev
  # deployed via `wrangler deploy` from ./mcp-server. This service is opt-in
  # and useful for offline development; enable it with:
  #     docker compose --profile selfhost up
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    profiles:
      - selfhost
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Bots (optional)
  # ---------------------------------------------------------------------------
  slack-bot:
    build:
      context: ./bots/slack
      dockerfile: Dockerfile
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN}
    profiles:
      - bots
    restart: unless-stopped

  discord-bot:
    build:
      context: ./bots/discord
      dockerfile: Dockerfile
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN}
    profiles:
      - bots
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./bots/telegram
      dockerfile: Dockerfile
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN}
    profiles:
      - bots
    restart: unless-stopped
